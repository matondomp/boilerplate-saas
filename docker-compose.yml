version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: boilerplate_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '123'
      MYSQL_DATABASE: 'my_db'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: boilerplate_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:6.0
    container_name: boilerplate_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:latest
    container_name: boilerplate_mailpit
    restart: always
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mysql_data:
  redis_data:
  mongo_data:
